{{- /* Language switch; only shown while more than one language is enabled. */}}
{{- if gt (len .AllTranslations) 1 }}
<nav class="lang" aria-label="{{ T "language" }}">
  {{- range .AllTranslations }}
  <a href="{{ .RelPermalink }}" hreflang="{{ .Language.Lang }}" lang="{{ .Language.Lang }}"{{ if eq .Language.Lang $.Language.Lang }} aria-current="page"{{ end }}>{{ .Language.Label }}</a>
  {{- end }}
</nav>
{{- end }}
